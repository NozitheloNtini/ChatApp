# Runs the full Maven test suite on every push and pull request.
# The Part 3 rubric needs the workflow to run ALL test classes
# (LoginClass, Message, MessageManagement), not just one, so
# "mvn test" is used rather than a single-class command.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Runs every *Test.java in src/test/java:
      # LoginClassTest, MessageTest, MessageManagementTest.
      - name: Run all tests
        run: mvn --batch-mode --no-transfer-progress test

      # Uploads the HTML/XML test reports so a failed run can be
      # inspected from the GitHub Actions summary without cloning
      # the repository and re-running locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/